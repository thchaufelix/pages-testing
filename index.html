<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1116;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
    }
    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      color: #d7dde8;
      font-size: 13px;
      letter-spacing: 0.01em;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Loading resources/mcp-test.obj…</div>
  <script type="module">
    import * as THREE from "three";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
    import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const status = document.getElementById("status");
    const modelUrl = "resources/mcp-test.obj";
    const materialUrl = "resources/mcp-test.mtl";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1116);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(4, 6, 3);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x9eb6ff, 0.55);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(10, 20, 0x2a3344, 0x1a2230);
    scene.add(grid);

    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.sub(center);
      object.position.y += size.y / 2;

      const radius = Math.max(size.x, size.y, size.z) * 0.5;
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2);
      camera.near = Math.max(distance / 200, 0.01);
      camera.far = distance * 20;
      camera.position.set(distance * 0.7, distance * 0.45, distance);
      camera.updateProjectionMatrix();
      controls.target.set(0, size.y * 0.35, 0);
      controls.update();

      grid.scale.setScalar(Math.max(size.x, size.z) / 5);
    }

    const mtlLoader = new MTLLoader();
    mtlLoader.setResourcePath("resources/");
    mtlLoader.load(
      materialUrl,
      (materials) => {
        materials.preload();
        const objLoader = new OBJLoader();
        objLoader.setMaterials(materials);
        objLoader.load(
          modelUrl,
          (object) => {
            scene.add(object);
            frameObject(object);
            status.textContent = "resources/mcp-test.obj — drag to orbit, scroll to zoom";
          },
          undefined,
          (error) => {
            status.textContent = "Failed to load OBJ.";
            console.error(error);
          }
        );
      },
      undefined,
      (error) => {
        status.textContent = "Failed to load MTL.";
        console.error(error);
      }
    );

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
